# Suítes automatizadas do Muninn (PR #85) rodando no CI: as mesmas do `make test`, mais o
# E2E do Playwright em modo mock e os testes Rust do Tauri.
# Ficam de fora (precisam de dados reais ou da chave do LLM): test-e2e-live, test-perf e test-eval.
name: Muninn · testes

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muninn-testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Muninn/etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Muninn/etl/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests

  nucleo:
    name: Núcleo Python (unittest, stdio, contrato)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Muninn/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Muninn/app/backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Unitários (datastore, authorizer, regressão)
        working-directory: Muninn/app/backend/nucleo
        run: python -m unittest core.tests core.test_datastore_sqlite
      - name: Processo por stdin/stdout
        run: python scripts/teste_stdio.py
      - name: Contrato RPC
        run: python scripts/teste_contrato.py

  front:
    name: Front (tipos, Vitest, Playwright mock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Muninn/app/frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Muninn/app/frontend-vue/package-lock.json
      - run: npm ci
      - name: Tipos + build
        run: npm run build
      - name: Unitários (Vitest)
        run: npm run test:unit
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, IPC do Tauri simulado)
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Muninn/app/frontend-vue/playwright-report
            Muninn/app/frontend-vue/test-results
          if-no-files-found: ignore

  tauri:
    name: Casca Tauri (cargo test)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Muninn/app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Muninn/app/src-tauri
      # O tauri-build exige que o frontendDist exista; o conteúdo não importa para os testes.
      - run: mkdir -p ../frontend-vue/dist && cargo test
