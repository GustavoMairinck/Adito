# Gera os instaladores do Muninn (Linux .deb e Windows .exe/.msi), publica um Release e
# atualiza o site do GitHub Pages (repositório apt + base de dados).
# Dispara com uma tag `muninn-vX.Y.Z` (a versão tem de bater com a do tauri.conf.json).
name: Muninn · release

on:
  push:
    tags: ["muninn-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # glibc mais antiga = .deb roda em mais distribuições
            bundles: deb
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: Muninn/app
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Muninn/app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Muninn/app/frontend-vue/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Muninn/app/src-tauri

      - name: Sidecar Python (PyInstaller)
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
          python scripts/build_sidecar.py

      - name: Front
        working-directory: Muninn/app/frontend-vue
        run: |
          npm ci
          npm run build

      - name: Instaladores (Tauri)
        run: frontend-vue/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: muninn-${{ runner.os }}
          if-no-files-found: error
          path: |
            Muninn/app/src-tauri/target/release/bundle/deb/*.deb
            Muninn/app/src-tauri/target/release/bundle/nsis/*.exe
            Muninn/app/src-tauri/target/release/bundle/msi/*.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Criar o Release (pré-lançamento)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la pacotes
          gh release create "$TAG" pacotes/* \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Muninn ${TAG#muninn-v}" \
            --notes "Instaladores de teste do Muninn.

          - **Windows:** baixe o \`.exe\` (ou o \`.msi\`) e execute.
          - **Linux (Debian/Ubuntu):** use o repositório apt em https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ ou baixe o \`.deb\` e rode \`sudo apt install ./arquivo.deb\`.

          A base de dados não vem no instalador: abra **Administração → Contextos de dados → Atualizar base**. A base publicada neste teste é **fictícia**."

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/muninn-pages.yml
    secrets: inherit
